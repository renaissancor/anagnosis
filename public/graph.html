<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph — Anagnosis</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/shared/reading-room.css" />
  <link rel="stylesheet" href="/shared/graph.css" />
</head>
<body>
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <div class="column graph-intro">
    <h1>Graph of succession</h1>
    <p class="lede">Polities placed by the year they began. Ink lines are decided claims. Pencil lines are computed overlaps, which you can add below; nobody has judged them.</p>
    <div class="graph-controls">
      <label class="filter">Choose a polity
        <input type="search" id="polity-choice" list="polity-names" autocomplete="off" />
        <datalist id="polity-names"></datalist>
      </label>
      <fieldset class="evidence-choice">
        <legend>Computed evidence</legend>
        <label><input type="radio" name="evidence" value="none" checked /> Hidden</label>
        <label><input type="radio" name="evidence" value="chosen" /> For the chosen polity</label>
        <label><input type="radio" name="evidence" value="all" /> <span id="all-label">All overlaps</span></label>
      </fieldset>
    </div>
    <p class="state" id="graph-status" role="status"></p>
  </div>
  <div class="graph-frame">
    <div class="graph-zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-in">Zoom in</button>
      <button type="button" id="zoom-out">Zoom out</button>
      <button type="button" id="zoom-fit">Fit</button>
    </div>
    <svg id="graph" role="group" aria-label="Polities by start year, joined by decided claims and any computed overlaps you added"></svg>
  </div>
  <div class="column" id="graph-reading"></div>
</main>
<div id="site-footer"></div>
<script src="/shared/vendor/d3.v7.min.js"></script>
<script src="/shared/cache.js"></script>
<script src="/shared/site.js"></script>
<script src="/graph.js"></script>
</body>
</html>
